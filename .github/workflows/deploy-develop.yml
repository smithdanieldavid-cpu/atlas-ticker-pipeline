name: Deploy Tickers (Develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  DEPLOY_ENV: dev
  CLOUDFRONT_DIST_ID: E3202GZ5910KGI
  S3_BUCKET: data-atlas-dashboard
  S3_PREFIX: instruments/dev

jobs:
  refresh-and-deploy:
    name: Transform, Validate, Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clone free-ticker-database
        run: |
          git clone --depth 1 \
            https://github.com/adanos-software/free-ticker-database.git \
            /tmp/ticker-source

      - name: Rebuild ticker database
        working-directory: /tmp/ticker-source
        run: python3 scripts/rebuild_dataset.py

      - name: Transform tickers
        run: |
          python3 scripts/transform_tickers.py \
            --input /tmp/ticker-source/data/tickers.db \
            --output instruments.json

      - name: Validate data quality
        run: python3 scripts/validate.py --input instruments.json

      - name: Configure AWS credentials
        if: success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload tickers to S3
        run: |
          aws s3 cp instruments.json.gz \
            s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/latest.json.gz \
            --content-type application/json \
            --content-encoding gzip \
            --cache-control "max-age=604800"

      - name: Upload dated snapshot
        run: |
          STAMP=$(date -u +"%Y-%m-%d")
          aws s3 cp instruments.json.gz \
            s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/latest-${STAMP}.json.gz \
            --content-type application/json \
            --content-encoding gzip

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/${{ env.S3_PREFIX }}/*"

      - name: Log summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "Deploy Summary (${{ env.DEPLOY_ENV }})"
          echo "════════════════════════════════════════"
          echo "S3: s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/latest.json.gz"
          if [ -f instruments.json ]; then
            echo "Instruments:   $(jq -r '.count' instruments.json)"
            echo "ISIN coverage: $(jq -r '.isin_coverage_pct' instruments.json)%"
            echo "Exchanges:     $(jq -r '.exchanges | keys | join(", ")' instruments.json)"
          else
            echo "No instruments.json produced — transform did not complete."
          fi
          echo "════════════════════════════════════════"